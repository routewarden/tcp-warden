name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-go:
    name: Go 1.27.1 Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go 1.27.1
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.1"
          cache: true

      - name: Run Go Tests with Race Detection
        run: go test -v -race ./...

      - name: Run Coverage Check
        run: |
          go test -v -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out

      - name: Build Binary
        run: go build -v -o tcp-warden .

      - name: Smoke Test CLI Execution
        run: |
          ./tcp-warden version
          ./tcp-warden plugins list
          ./tcp-warden validate --config tcp-warden.yaml

  docker-build-test:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (Dry Run)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: routewarden/tcp-warden:test

  ci-success:
    name: CI Status Check
    needs: [test-go, docker-build-test]
    runs-on: ubuntu-latest
    steps:
      - name: Publish CI Results Summary
        run: |
          echo "## 🛡️ TCP Warden CI Validation Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| **Go Tests & Race Detector** | ✅ Passed | Ran with \`-race\` on Go 1.27.1 |" >> $GITHUB_STEP_SUMMARY
          echo "| **Binary Build & Smoke Tests** | ✅ Passed | Tested \`version\`, \`plugins list\`, and \`validate\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Docker Build** | ✅ Passed | Multi-stage Dockerfile built cleanly |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🎉 **Ready for merge! All checks passed.**" >> $GITHUB_STEP_SUMMARY
