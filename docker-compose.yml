services:
  tcp-warden:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/routewarden/tcp-warden:latest
    container_name: tcp-warden
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    network_mode: host
    volumes:
      - tcp-warden-config:/etc/routewarden
      - tcp-warden-data:/var/lib/routewarden
      - tcp-warden-logs:/var/log/routewarden
      # Bind-mount the socket directory onto the host so the RouteWarden CLI
      # dashboard can connect via unix:///var/run/routewarden/tcp-warden.sock
      # without needing an open TCP port. Docker creates the host directory
      # automatically on first run (owned by root; chmod as needed).
      - /var/run/routewarden:/var/run/routewarden
    environment:
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY:-}
      - ROUTEWARDEN_CONFIG=/etc/routewarden/tcp-warden.yaml

  crowdsec:
    image: crowdsecurity/crowdsec:latest
    container_name: crowdsec
    restart: unless-stopped
    environment:
      - COLLECTIONS=crowdsecurity/linux
    volumes:
      - ./crowdsec/acquis.yaml:/etc/crowdsec/acquis.d/tcp-warden.yaml:ro
      - ./crowdsec/parsers/s01-parse/routewarden-tcp-warden.yaml:/etc/crowdsec/parsers/s01-parse/routewarden-tcp-warden.yaml:ro
      - ./crowdsec/scenarios/routewarden-tcp-ssh-bf.yaml:/etc/crowdsec/scenarios/routewarden-tcp-ssh-bf.yaml:ro
      - ./crowdsec/scenarios/routewarden-tcp-smtp-bf.yaml:/etc/crowdsec/scenarios/routewarden-tcp-smtp-bf.yaml:ro
      - ./crowdsec/scenarios/routewarden-tcp-portscan.yaml:/etc/crowdsec/scenarios/routewarden-tcp-portscan.yaml:ro
      - tcp-warden-logs:/var/log/routewarden:ro
      - crowdsec-db:/var/lib/crowdsec/data
      - crowdsec-config:/etc/crowdsec
    ports:
      - "8080:8080"

volumes:
  tcp-warden-config:
  tcp-warden-data:   # persistent runtime state: bans.db (SQLite) & plugins cache
  tcp-warden-logs:
  crowdsec-db:
  crowdsec-config:
