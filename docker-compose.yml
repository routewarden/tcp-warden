services:
  tcp-warden:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/routewarden/tcp-warden:latest
    container_name: tcp-warden
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
      - CHOWN
    # Network configuration:
    # - Linux: Uncomment 'network_mode: host' for native host networking and real client IP visibility.
    # - macOS / Windows: Use 'ports:' below because Docker Desktop runs in a Linux VM where
    #   'network_mode: host' cannot expose ports to the macOS host loopback.
    # network_mode: host
    ports:
      - "9091:9091"     # RouteWarden Management & Stats API
      - "15432:15432"   # generic_bastion (active L4 proxy service)
      # Additional service port examples (uncomment as enabled in tcp-warden.yaml):
      - "2222:2222"     # SSH Guard
      # - "25:2525"     # SMTP Mail Guard
      # - "587:5870"    # SMTP Submission Guard
      # - "80:8081"     # HTTP Protocol Guard
      # - "443:8443"    # TLS SNI Router & Guard
      # - "110:1110"    # POP3 Mail Guard
      # - "995:9950"    # POP3S Guard
      # - "143:1143"    # IMAP4 Mail Guard
      # - "993:9930"    # IMAPS Guard
      # - "21:2121"     # FTP Control Guard
      # - "389:1390"    # LDAP Guard
      # - "636:1636"    # LDAPS Guard
      - "5433:5433"   # PostgreSQL Bastion
      # - "3306:3306"   # MySQL Bastion
      # - "6379:6379"   # Redis Guard
      # - "27017:27017" # MongoDB Guard
      # - "11211:11211" # Memcached Guard
      # - "5672:5672"   # AMQP / RabbitMQ Guard
      # - "1883:1883"   # MQTT Guard
      # - "5900:5900"   # VNC Remote Desktop Guard
      # - "25565:25565" # Minecraft Java Guard
    volumes:
      # tcp-warden logs
      - tcp-warden-logs:/var/log/routewarden
      - tcp-warden-config:/etc/routewarden/  # Direct host config bind (no volume needed)
      - tcp-warden-data:/var/lib/routewarden                  # Runtime state: bans.db (SQLite) & plugins cache
      - ../plugins:/plugins:ro                                # Host plugins repository (contains postgres, mysql, etc.)
      # Unix socket mount (Linux only):
      # On native Linux, uncomment the line below to share the socket for local IPC:
      # - /var/run/routewarden:/var/run/routewarden
      # NOTE: On macOS Docker Desktop, Unix domain sockets cannot cross the VM boundary
      # to the macOS host. Use TCP port 9091 instead for macOS CLI and dashboard.
    # tmpfs:
      # - /var/log/routewarden:size=64M                         # Ephemeral in-memory logs (automatically discarded on exit)
    environment:
      - CROWDSEC_API_KEY=${CROWDSEC_API_KEY:-}
      - ROUTEWARDEN_CONFIG=/etc/routewarden/tcp-warden.yaml
      - ROUTEWARDEN_API_LISTEN=0.0.0.0:9091
      - AUTO_INSTALL_PLUGINS=postgres ssh

volumes:
  tcp-warden-config:
  tcp-warden-logs:
  tcp-warden-data:   # persistent runtime state: bans.db (SQLite) & plugins cache
