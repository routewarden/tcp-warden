# tcp-warden.yaml
# RouteWarden TCP Security Proxy & L4 Firewall Configuration
# Schema: https://routewarden.github.io/tcp-warden/tcp-warden.schema.json

version: "1.0"
# Global daemon policy defaults
global:
  max_connections: 10000
  ban_duration: "1h"
  ban_after_failures: 5
  tarpit_ms: 1000
  log_level: "info"
  log_file: "/var/log/routewarden/tcp-warden.jsonl"
  # Directory for persistent runtime state (bans.db SQLite database survives restarts)
  # Mount this path as a named Docker volume to preserve bans across container restarts.
  data_dir: "/var/lib/routewarden"
  geoip_db: "/etc/routewarden/GeoLite2-Country.mmdb"
  ip_filter:
    allow: []
    deny: []
  geo_block:
    deny_countries: []
    allow_countries: []
# Management & metrics API (REST + Server-Sent Events)
api:
  enabled: true
  listen: "127.0.0.1:9091"
  # Optional Unix domain socket for local IPC (avoids exposing TCP ports or container port-mapping):
  socket: "/var/run/routewarden/tcp-warden.sock"
  socket_mode: "0666"
# CrowdSec LAPI Bouncer integration
crowdsec:
  enabled: false
  lapi_url: "http://127.0.0.1:8080"
  api_key: "${CROWDSEC_API_KEY}"
  update_frequency: "10s"
# Modular Protocol Plugins
# Non-standard protocol plugins live in https://github.com/routewarden/plugins
# Install them via CLI:
#   tcp-warden plugins install https://github.com/routewarden/plugins/postgres
# Or declare them below to automatically pull, cache, and activate on boot:
# plugins:
#   postgres:
#     enabled: true
#     source: "https://github.com/routewarden/plugins/postgres"
#   redis:
#     enabled: true
#     source: "https://github.com/routewarden/plugins/redis"
plugins: {}
# Service definitions
services:
  # SSH Service Guard (Standard Protocol - Enabled)
  ssh:
    listen: ":2222"
    upstream: "127.0.0.1:22"
    protocol: "ssh"
    rate_limit:
      connections_per_minute: 20
      burst: 5
    geo_block:
      deny_countries:
        - "RU"
        - "CN"
        - "KP"
      allow_countries: []
    ip_filter:
      allow:
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "127.0.0.1/32"
      deny:
        - "198.51.100.0/24"
    max_auth_failures: 3
    ban_after_failures: 3
    ban_duration: "2h"
    response:
      mode: "reject" # drop | reject | tarpit | silent
      tarpit_ms: 1500
      reject_message: "Connection rejected by RouteWarden SSH Guard"
    ssh:
      banner: "RouteWarden SSH Guard"
      max_auth_tries: 3
  # SMTP Mail Transfer Guard (Standard Protocol - Enabled)
  smtp:
    listen: ":2525"
    upstream: "127.0.0.1:25"
    protocol: "smtp"
    rate_limit:
      connections_per_minute: 30
      burst: 10
    response:
      mode: "reject"
      reject_message: "554 5.7.1 Service unavailable; client blocked by RouteWarden"
    smtp:
      max_recipients: 10
      blocked_sender_domains:
        - "*.tempmail.com"
        - "spam.org"
      require_starttls: false
  # POP3 Mail Retrieval Guard (Standard Protocol - Enabled)
  pop3:
    listen: ":1110"
    upstream: "127.0.0.1:110"
    protocol: "pop3"
    rate_limit:
      connections_per_minute: 20
      burst: 5
    max_auth_failures: 3
    ban_after_failures: 3
  # IMAP Mail Retrieval Guard (Standard Protocol - Enabled)
  imap:
    listen: ":1143"
    upstream: "127.0.0.1:143"
    protocol: "imap"
    rate_limit:
      connections_per_minute: 20
      burst: 5
    max_auth_failures: 3
    ban_after_failures: 3
  # Generic TCP Tunnel (Standard Protocol - Enabled)
  database:
    listen: ":15432"
    upstream: "127.0.0.1:5432"
    protocol: "tcp"
    rate_limit:
      connections_per_minute: 120
      burst: 30
    ip_filter:
      allow:
        - "10.0.0.0/8"
        - "127.0.0.1"

