# tcp-warden.yaml
# RouteWarden TCP Security Proxy & L4 Firewall Configuration
# Schema: https://routewarden.github.io/tcp-warden/tcp-warden.schema.json

version: "1.0"

# Global daemon policy defaults
global:
  max_connections: 10000
  ban_duration: "1h"
  ban_after_failures: 5
  tarpit_ms: 1000
  log_level: "info"
  log_file: "/var/log/routewarden/tcp-warden.jsonl"
  geoip_db: "/etc/routewarden/GeoLite2-Country.mmdb"
  ip_filter:
    allow: []
    deny: []
  geo_block:
    deny_countries: []
    allow_countries: []

# Management & metrics API (REST + Server-Sent Events)
api:
  enabled: true
  listen: "127.0.0.1:9091"
  auth_token: ""

# CrowdSec LAPI Bouncer integration
crowdsec:
  enabled: false
  lapi_url: "http://127.0.0.1:8080"
  api_key: "${CROWDSEC_API_KEY}"
  update_frequency: "10s"
  fallback_action: "ban"

# Service definitions
services:
  # SSH Service Guard
  ssh:
    listen: ":2222"
    upstream: "127.0.0.1:22"
    protocol: "ssh"
    rate_limit:
      connections_per_minute: 20
      burst: 5
    geo_block:
      deny_countries:
        - "RU"
        - "CN"
        - "KP"
      allow_countries: []
    ip_filter:
      allow:
        - "10.0.0.0/8"
        - "192.168.0.0/16"
        - "127.0.0.1/32"
      deny:
        - "198.51.100.0/24"
    max_auth_failures: 3
    ban_after_failures: 3
    ban_duration: "2h"
    response:
      mode: "reject" # drop | reject | tarpit | silent
      tarpit_ms: 1500
      reject_message: "Connection rejected by RouteWarden SSH Guard"
    ssh:
      banner: "RouteWarden SSH Guard"
      max_auth_tries: 3

  # SMTP Mail Transfer Guard
  smtp:
    listen: ":2525"
    upstream: "127.0.0.1:25"
    protocol: "smtp"
    rate_limit:
      connections_per_minute: 30
      burst: 10
    response:
      mode: "reject"
      reject_message: "554 5.7.1 Service unavailable; client blocked by RouteWarden"
    smtp:
      max_recipients: 10
      blocked_sender_domains:
        - "*.tempmail.com"
        - "spam.org"
      require_starttls: false

  # POP3 Mail Retrieval Guard
  pop3:
    listen: ":1110"
    upstream: "127.0.0.1:110"
    protocol: "pop3"
    rate_limit:
      connections_per_minute: 20
      burst: 5
    max_auth_failures: 3
    ban_after_failures: 3

  # IMAP Mail Retrieval Guard
  imap:
    listen: ":1143"
    upstream: "127.0.0.1:143"
    protocol: "imap"
    rate_limit:
      connections_per_minute: 20
      burst: 5
    max_auth_failures: 3
    ban_after_failures: 3

  # PostgreSQL Database Guard
  postgres:
    listen: ":5433"
    upstream: "127.0.0.1:5432"
    protocol: "postgres"
    max_auth_failures: 3
    ban_after_failures: 3
    ban_duration: "1h"

  # MySQL Database Guard
  mysql:
    listen: ":3307"
    upstream: "127.0.0.1:3306"
    protocol: "mysql"
    max_auth_failures: 3
    ban_after_failures: 3
    ban_duration: "1h"

  # Redis Cache Guard with Command Filtering
  redis:
    listen: ":6380"
    upstream: "127.0.0.1:6379"
    protocol: "redis"
    max_auth_failures: 5
    ban_after_failures: 5
    redis:
      blocked_commands:
        - "FLUSHALL"
        - "FLUSHDB"
        - "CONFIG"
        - "SHUTDOWN"

  # FTP File Transfer Guard
  ftp:
    listen: ":2121"
    upstream: "127.0.0.1:21"
    protocol: "ftp"
    max_auth_failures: 3
    ban_after_failures: 3

  # TLS SNI Domain Filter / Passthrough Guard
  tls-proxy:
    listen: ":8443"
    upstream: "127.0.0.1:443"
    protocol: "tls"
    tls:
      allowed_domains:
        - "*.example.com"
        - "app.internal"
      blocked_domains:
        - "*.phishing.com"

  # Generic TCP Tunnel
  database:
    listen: ":15432"
    upstream: "127.0.0.1:5432"
    protocol: "tcp"
    rate_limit:
      connections_per_minute: 120
      burst: 30
    ip_filter:
      allow:
        - "10.0.0.0/8"
        - "127.0.0.1"

  # Custom Plugin Example: Content / Exploit Signature Filter
  text-filter:
    enabled: false
    listen: ":9000"
    upstream: "127.0.0.1:9001"
    protocol: "echo_filter"
    plugin_config:
      banned_keywords:
        - "EXPLOIT"
        - "DROP TABLE"
        - "MALWARE"

  # Custom Plugin Example: IoT MQTT Broker Guard
  mqtt-broker:
    enabled: false
    listen: ":1883"
    upstream: "127.0.0.1:18883"
    protocol: "mqtt"
    plugin_config:
      blocked_client_id_prefixes:
        - "bot-"
        - "scanner-"
        - "shodan"
      max_client_id_len: 64
